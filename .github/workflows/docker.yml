name: Build and push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker build . --file Dockerfile \
        --tag jotacor/padelamericano:latest \
        --tag jotacor/padelamericano:$(echo $GITHUB_SHA | cut -c1-8)
    - name: Docker login
      env:
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "$DOCKER_PASSWORD" | docker login -u jotacor --password-stdin
    - name: Docker push
      run: docker push jotacor/padelamericano --all-tags
