name = "padel-americano"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# KV Namespace for storing shared tournaments (account Jotacor)
[[kv_namespaces]]
binding = "TOURNAMENTS"
id = "c735700d9b364c219d280986bf32200a"

# Preview deployments (PRs) use their own namespace. Pages needs every binding redeclared here.
[env.preview]
[[env.preview.kv_namespaces]]
binding = "TOURNAMENTS"
id = "f572223916604534ae8344b85263b56f"
