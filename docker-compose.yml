# docker compose up -d --build   → http://localhost:8788
# Optional: put HOST_PORT=... in a .env file next to this one.
services:
  padel:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-} # optional: GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
    image: jotacor/padelamericano:latest
    ports:
      - "${HOST_PORT:-8788}:8788"
    volumes:
      - padel-data:/data # shared tournaments (JSON files), survive restarts
    restart: unless-stopped

volumes:
  padel-data:
