# docker compose up -d --build   → http://localhost:8788
# Optional: put HOST_PORT=... in a .env file next to this one.
services:
  padel:
    build: .
    image: jotacor/padelamericano:latest
    ports:
      - "${HOST_PORT:-8788}:8788"
    volumes:
      - padel-data:/data # shared tournaments (KV), survive restarts
    restart: unless-stopped

volumes:
  padel-data:
